services:
  postgres:
    image: postgres:16-alpine
    container_name: risk-investigation-v4-db
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: risk_copilot
    ports:
      - "5433:5432"
    volumes:
      - risk_v4_pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  risk_v4_pgdata:
